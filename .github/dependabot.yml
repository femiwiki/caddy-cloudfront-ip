---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        applies-to: security-updates
        patterns:
          - 'go.opentelemetry.io/*'
