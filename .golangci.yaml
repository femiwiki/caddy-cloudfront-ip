---
version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - funlen
    - gocritic
    - misspell
    - nolintlint
    - unconvert
  settings:
    govet:
      enable:
        - nilness
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Table-driven test cases are data, so their length says nothing.
      - path: _test\.go
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
